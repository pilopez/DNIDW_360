  activaRow.appendChild(document.createTextNode("Activar esta campaña inmediatamente"));
  formCard.appendChild(activaRow);

  formCard.appendChild(el("button", {className:"btn btn-primary btn-sm", onClick: async () => {
    const mes = mesSel.value;
    const anio = anioInput.value.trim();
    if (!mes || !anio || anio.length !== 4) { alert("Selecciona mes y año (4 dígitos)."); return; }
    state.loading = true; render();
    try {
      await apiRequest("SaveCampana", {
        method: "POST",
        body: JSON.stringify({ Mes: parseInt(mes), Anio: parseInt(anio), Activa: activaChk.checked })
      });
      await loadCampanas();
    } catch(e) { alert("Error: " + e.message); }
    state.loading = false; render();
  }}, "Crear campaña"));
  cont.appendChild(formCard);

  // Lista de campañas
  cont.appendChild(el("div", {className:"section-label", style:{marginTop:"8px"}}, "Historial de campañas"));
  if (!state.campanas.length) {
    cont.appendChild(el("div", {className:"empty"}, "No hay campañas creadas aún."));
  }
  state.campanas.forEach(c => {
    const row = el("div", {style:{
      display:"flex", alignItems:"center", gap:"10px", padding:"12px 16px",
      background:"var(--surface)", border:"1px solid var(--border)",
      borderRadius:"10px", marginBottom:"6px"
    }});
    const info = el("div", {style:{flex:"1"}});
    info.appendChild(el("div", {style:{fontWeight:"700", fontSize:"14px", color:"var(--text)"}}, c.Nombre));
    info.appendChild(el("div", {style:{fontSize:"12px", color:"var(--faint)"}}, c.FechaCreacion ? new Date(c.FechaCreacion).toLocaleDateString("es-ES") : ""));
    row.appendChild(info);

    const pill = el("span", {className:"pill"});
    pill.style.background = c.Activa ? "var(--green-bg)" : "#F1F5F9";
    pill.style.color = c.Activa ? "var(--green)" : "var(--faint)";
    pill.textContent = c.Activa ? "● Activa" : "Inactiva";
    row.appendChild(pill);

    // Botón Activar / Desactivar
    if (!c.Activa) {
      row.appendChild(el("button", {className:"btn btn-success btn-sm", onClick: async () => {
        state.loading = true; render();
        try {
          await apiRequest("SaveCampana", { method:"POST", body: JSON.stringify({ ID: c.ID, Mes: c.Mes, Anio: c.Anio, Activa: true }) });
          await loadCampanas();
        } catch(e) { alert("Error: " + e.message); }
        state.loading = false; render();
      }}, "▶ Activar"));
    } else {
      row.appendChild(el("button", {className:"btn btn-secondary btn-sm", onClick: async () => {
        if (!confirm(`¿Desactivar la campaña "${c.Nombre}"?\nSeguirá existiendo en el historial pero dejará de recibir evaluaciones.`)) return;
        state.loading = true; render();
        try {
          await apiRequest("SaveCampana", { method:"POST", body: JSON.stringify({ ID: c.ID, Mes: c.Mes, Anio: c.Anio, Activa: false }) });
          await loadCampanas();
        } catch(e) { alert("Error: " + e.message); }
        state.loading = false; render();
      }}, "⏸ Desactivar"));
    }

    // Botón Eliminar
    row.appendChild(el("button", {className:"btn btn-danger btn-sm", onClick: async () => {
      const msg = c.Activa
        ? `⚠️ "${c.Nombre}" está ACTIVA.\n\nEliminarla borrará también todas sus evaluaciones. ¿Seguro?`
        : `¿Eliminar la campaña "${c.Nombre}"?\n\nSe borrarán todas sus evaluaciones. Esta acción no se puede deshacer.`;
      if (!confirm(msg)) return;
      state.loading = true; render();
      try {
        await apiRequest(`DeleteCampana?id=${encodeURIComponent(c.ID)}`, { method:"DELETE" });
        await loadCampanas();
      } catch(e) { alert("Error al eliminar: " + e.message); }
      state.loading = false; render();
    }}, "🗑 Eliminar"));

    // Ver resumen histórico
    row.appendChild(el("button", {className:"btn btn-secondary btn-sm", onClick: async () => {
      state.loading = true; render();
      try {
        // Asegurar que el equipo y evaluadores están cargados para el resumen
        if (!state.team.length) await loadTeam();
        if (!state.evaluators.length) await loadEvaluators();
        const respsCampana = await apiRequest(`GetRespuestas?periodoID=${encodeURIComponent(c.ID)}`);
        state.loading = false;
        renderResumenCampana(c, respsCampana);
      } catch(e) {
        state.loading = false;
        alert("Error al cargar resumen: " + e.message);
        render();
      }
    }}, "Ver resumen"));

    cont.appendChild(row);
  });
  return cont;
}

// ─── Resumen ejecutivo de campaña ─────────────────────────
function renderResumenCampana(campana, responses) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const topbar = renderTopbar();
  if (topbar) app.appendChild(topbar);

  const cont = el("div", {className:"container"});
  cont.appendChild(el("button", {className:"btn btn-secondary btn-sm", style:{marginBottom:"20px"}, onClick: () => { state.view = "adminCampanas"; render(); }}, "← Volver a campañas"));
  cont.appendChild(el("div", {className:"page-title"}, `Resumen ejecutivo · ${campana.Nombre}`));

  if (!responses.length) {
    cont.appendChild(el("div", {className:"empty"}, "Sin evaluaciones en esta campaña."));
    app.appendChild(cont);
    return;
  }

  const evaluadosIDs = [...new Set(responses.map(r => r.EvaluadoID))];
  const evaluadoresIDs = [...new Set(responses.map(r => r.EvaluadorID))];
  const totalEvaluadores = state.evaluators.length || evaluadoresIDs.length;
  const evaluadoresQueEnviaron = evaluadoresIDs.length;
  const pctParticipacion = totalEvaluadores > 0 ? Math.round(evaluadoresQueEnviaron / totalEvaluadores * 100) : 100;

  // Stats globales
  const statsGrid = el("div", {className:"stats-grid", style:{marginBottom:"16px"}});
  [
    {n: evaluadosIDs.length, l: "Evaluados"},
    {n: `${evaluadoresQueEnviaron}/${totalEvaluadores}`, l: "Participación"},
    {n: `${pctParticipacion}%`, l: "Tasa de respuesta"},
    {n: responses.length, l: "Evaluaciones totales"}
  ].forEach(({n,l}) => {
    const sc = el("div", {className:"stat-card"});
    sc.appendChild(el("div", {className:"stat-number", style:{fontSize:"22px"}}, String(n)));
    sc.appendChild(el("div", {className:"stat-label"}, l));
    statsGrid.appendChild(sc);
  });
  cont.appendChild(statsGrid);

  // Evaluadores pendientes y finalizados — basado en su selección guardada
  const pendCard = el("div", {className:"card card-warn", style:{marginBottom:"16px"}});
  pendCard.appendChild(el("div", {className:"section-label"}, "⏳ Evaluadores pendientes"));
  const doneCard = el("div", {className:"card", style:{marginBottom:"16px", background:"var(--green-bg)", border:"1px solid var(--green)"}});
  doneCard.appendChild(el("div", {className:"section-label", style:{color:"var(--green)"}}, "✅ Evaluadores finalizados"));

  let hayPendientes = false;
  let hayFinalizados = false;

  state.evaluators.forEach(ev => {
    // Recuperar selección guardada de este evaluador para esta campaña
    const selKey = `sel_${ev.Email || ev.ID}_${campana.ID}`;
    let seleccion = [];
    try {
      const saved = localStorage.getItem(selKey);
      if (saved) seleccion = JSON.parse(saved);
    } catch(e) {}

    // Las evaluaciones que ya envió en esta campaña
    const enviadas = responses.filter(r =>
      r.EvaluadorID === ev.ID || r.EvaluadorID === ev.Email
    );
    const evaluadosIDs = [...new Set(enviadas.map(r => r.EvaluadoID))];

    if (seleccion.length > 0) {
      // Tiene selección guardada — calcular pendientes de su lista
      const pendientes = seleccion.filter(id => !evaluadosIDs.includes(id));
      const totalSel = seleccion.length;
      const done = pendientes.length === 0;
      if (done) {
        doneCard.appendChild(el("div", {style:{fontSize:"13px",color:"var(--green)",padding:"3px 0"}},
          `· ${ev.Nombre} (${totalSel}/${totalSel} evaluados)`));
        hayFinalizados = true;
      } else {
        pendCard.appendChild(el("div", {style:{fontSize:"13px",color:"var(--yellow)",padding:"3px 0"}},
          `· ${ev.Nombre} — ${pendientes.length}/${totalSel} personas pendientes`));
        hayPendientes = true;
      }
    } else {
      // Sin selección guardada — si ya envió evaluaciones, mostrar como finalizado con las que hizo
      // Si no envió ninguna, mostrar como pendiente "sin iniciar"
      if (evaluadosIDs.length > 0) {
        doneCard.appendChild(el("div", {style:{fontSize:"13px",color:"var(--green)",padding:"3px 0"}},
          `· ${ev.Nombre} (${evaluadosIDs.length} evaluados · selección no guardada)`));
        hayFinalizados = true;
      } else {
        pendCard.appendChild(el("div", {style:{fontSize:"13px",color:"var(--yellow)",padding:"3px 0"}},
          `· ${ev.Nombre} — sin iniciar`));
        hayPendientes = true;
      }
    }
  });

  if (!hayPendientes) {
    pendCard.appendChild(el("div", {style:{fontSize:"13px",color:"var(--green)",padding:"3px 0"}}, "🎉 Todos los evaluadores han completado sus evaluaciones."));
  }
  cont.appendChild(pendCard);
  if (hayFinalizados) cont.appendChild(doneCard);

  // Ranking del equipo
  const rankCard = el("div", {className:"card", style:{marginBottom:"16px"}});
  rankCard.appendChild(el("div", {className:"section-label"}, "🏆 Ranking del equipo"));
  const ranking = evaluadosIDs.map(id => {
    const member = state.team.find(m => m.ID === id);
    const resps = responses.filter(r => r.EvaluadoID === id);
    const avg = calcWeightedAvg(resps, member?.Rol, member);
    return { id, nombre: member?.Nombre || id, rol: member?.Rol || "", avg: avg ? parseFloat(avg) : 0, count: resps.length };
  }).sort((a,b) => b.avg - a.avg);

  ranking.forEach((item, idx) => {
    const row = el("div", {style:{display:"flex", alignItems:"center", gap:"12px", padding:"10px 0", borderBottom:"1px solid var(--border)"}});
    const medal = ["🥇","🥈","🥉"][idx] || `${idx+1}.`;
    row.appendChild(el("div", {style:{width:"28px", textAlign:"center", fontSize:"16px", flexShrink:"0"}}, medal));
    const info = el("div", {style:{flex:"1"}});
    info.appendChild(el("div", {style:{fontWeight:"700", fontSize:"13px", color:"var(--text)"}}, item.nombre));
    info.appendChild(el("div", {style:{fontSize:"11px", color:"var(--faint)"}}, `${item.rol} · ${item.count} evaluaciones`));
    row.appendChild(info);
    const scoreEl = el("div", {style:{fontWeight:"900", fontSize:"18px", color: item.avg > 0 ? getScoreColor(item.avg.toFixed(1)) : "var(--faint)"}}, item.avg > 0 ? item.avg.toFixed(2) : "–");
    row.appendChild(scoreEl);
    rankCard.appendChild(row);
  });
  cont.appendChild(rankCard);

  // Drivers medios del equipo
  const driversCard = el("div", {className:"card", style:{marginBottom:"16px"}});
  driversCard.appendChild(el("div", {className:"section-label"}, "📊 Media de drivers del equipo"));
  const driverAvgs = DRIVER_ORDER.map(d => ({ d, avg: calcDriverAvg(responses, d) }));
  const bestDriver = driverAvgs.filter(x => x.avg).sort((a,b) => parseFloat(b.avg) - parseFloat(a.avg))[0];
  const worstDriver = driverAvgs.filter(x => x.avg).sort((a,b) => parseFloat(a.avg) - parseFloat(b.avg))[0];
  driverAvgs.forEach(({d, avg}) => {
    const avgNum = avg ? parseFloat(avg) : 0;
    const isBest = d === bestDriver?.d;
    const isWorst = d === worstDriver?.d;
    const row = el("div", {style:{display:"flex", alignItems:"center", gap:"12px", padding:"8px 0", borderBottom:"1px solid var(--border)"}});
    row.appendChild(el("span", {style:{fontSize:"16px", width:"22px"}}, DRIVER_ICONS[d]));
    const nameWrap = el("div", {style:{flex:"1"}});
    nameWrap.appendChild(el("div", {style:{fontSize:"13px", fontWeight:"600", color:"var(--text)"}}, DRIVER_NAMES[d]));
    if (isBest) nameWrap.appendChild(el("div", {style:{fontSize:"10px", color:"var(--green)", fontWeight:"700"}}, "▲ Punto fuerte del equipo"));
    if (isWorst && d !== bestDriver?.d) nameWrap.appendChild(el("div", {style:{fontSize:"10px", color:"var(--yellow)", fontWeight:"700"}}, "↑ Área de desarrollo"));
    row.appendChild(nameWrap);
    const barWrap = el("div", {className:"driver-bar-wrap"});
    barWrap.appendChild(renderProgressBar(avgNum/5, avg ? getScoreColor(avg) : undefined));
    row.appendChild(barWrap);
    row.appendChild(el("div", {style:{width:"36px", textAlign:"center", fontWeight:"800", fontSize:"14px", color: avg ? getScoreColor(avg) : "var(--faint)"}}, avg || "–"));
    driversCard.appendChild(row);
  });
  cont.appendChild(driversCard);

  // Evaluadores con scores extremos (solo 4 y 5)
  const extremos = evaluadoresIDs.filter(evID => {
    const evResps = responses.filter(r => r.EvaluadorID === evID);
    return evResps.every(r => DRIVER_ORDER.every(d => {
      const map = { capacidad_analitica:"CapAnalit", excelencia_entrega:"ExcEntrega", trabajo_equipo:"TrabEquipo", gestion:"Gestion", interlocucion:"Interlocucion", conocimiento_tecnico:"ConocTecnico" };
      const score = r[`Score_${map[d]}`] || 0;
      return score === 0 || score >= 4;
    }));
  });

  if (extremos.length) {
    const extremosCard = el("div", {className:"card", style:{marginBottom:"16px", background:"#FFFBEB", borderColor:"#FDE68A"}});
    extremosCard.appendChild(el("div", {className:"section-label"}, "⚠️ Evaluadores con sesgo positivo (solo puntuaciones 4 y 5)"));
    extremosCard.appendChild(el("div", {style:{fontSize:"12px", color:"var(--yellow)", marginBottom:"8px"}}, "Estos evaluadores han usado exclusivamente puntuaciones altas en todas sus evaluaciones. Considera revisarlas."));
    extremos.forEach(evID => {
      const evaluador = state.evaluators.find(e => e.ID === evID || e.Email === evID);
      extremosCard.appendChild(el("div", {style:{fontSize:"13px", color:"var(--text)", padding:"3px 0"}}, `· ${evaluador?.Nombre || evID}`));
    });
    cont.appendChild(extremosCard);
  }

  app.appendChild(cont);
}

// ═══ ADMIN CONFIG DRIVERS (F4) ═══
async function renderAdminConfigDrivers() {
  const cont = el("div", {className:"container"});
  cont.appendChild(el("div", {className:"page-title"}, "Configuración de drivers"));
  cont.appendChild(el("div", {className:"page-sub"}, "Personaliza pesos y criterios por evaluado. Los valores base son los del rol."));

  if (state.editingConfigSubject) {
    const subject = state.editingConfigSubject;
    await loadConfigDrivers(subject.ID);
    const cfg = getDriverConfig(subject);
    const base = DRIVERS_CONFIG[subject.Rol] || DRIVERS_CONFIG["Senior Consultant"];

    const formCard = el("div", {className:"card card-blue", style:{marginBottom:"16px"}});
    formCard.appendChild(el("div", {style:{fontWeight:"800", fontSize:"16px", color:"var(--indra)", marginBottom:"4px"}}, subject.Nombre));
    formCard.appendChild(el("div", {style:{fontSize:"13px", color:"var(--muted)", marginBottom:"16px"}}, `${subject.Rol} · Grado ${subject.Grado}`));

    const localValues = {};
    DRIVER_ORDER.forEach(d => {
      const ov = state.configDrivers[subject.ID]?.[d] || {};
      // Support dynamic criteria list (Criterios JSON) or legacy Criterio1/2
      let savedCriterios;
      if (ov.Criterios) {
        try { savedCriterios = JSON.parse(ov.Criterios); } catch(e) { savedCriterios = null; }
      }
      if (!savedCriterios) {
        savedCriterios = [
          ov.Criterio1 !== undefined ? ov.Criterio1 : base.criteria[d][0],
          ov.Criterio2 !== undefined ? ov.Criterio2 : base.criteria[d][1]
        ];
      }
      localValues[d] = {
        peso: ov.Peso !== undefined ? ov.Peso : base.weights[d],
        criterios: [...savedCriterios]
      };
    });

    DRIVER_ORDER.forEach(d => {
      const dCard = el("div", {style:{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:"10px", padding:"14px 16px", marginBottom:"10px"}});

      const dHeader = el("div", {style:{display:"flex", gap:"8px", alignItems:"center", marginBottom:"10px"}});
      dHeader.appendChild(el("span", {style:{fontSize:"18px"}}, DRIVER_ICONS[d]));
      dHeader.appendChild(el("div", {style:{fontWeight:"700", fontSize:"14px", color:"var(--text)"}}, DRIVER_NAMES[d]));
      dCard.appendChild(dHeader);

      // Peso
      const pesoRow = el("div", {style:{display:"flex", alignItems:"center", gap:"10px", marginBottom:"12px"}});
      pesoRow.appendChild(el("label", {style:{fontSize:"12px", fontWeight:"600", color:"var(--muted)", width:"60px", flexShrink:"0"}}, "Peso %"));
      const pesoInput = el("input", {type:"number", min:"0", max:"100", step:"1"});
      pesoInput.value = Math.round(localValues[d].peso * 100);
      pesoInput.style.cssText = "width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:13px;font-family:inherit;";
      pesoInput.addEventListener("input", e => { localValues[d].peso = parseFloat(e.target.value) / 100; });
      pesoRow.appendChild(pesoInput);

      const isModified = state.configDrivers[subject.ID]?.[d] !== undefined;
      if (isModified) {
        const resetBtn = el("button", {className:"btn btn-secondary btn-sm", onClick: async () => {
          state.loading = true; render();
          try {
            await apiRequest(`SaveConfig?evaluadoID=${subject.ID}&driverID=${d}`, { method: "DELETE" });
            delete state.configDrivers[subject.ID][d];
            state.editingConfigSubject = subject;
          } catch(e) { alert("Error: " + e.message); }
          state.loading = false;
          const c = await renderAdminConfigDrivers();
          document.getElementById("app").lastChild?.replaceWith?.(c);
        }}, "\u21BA Reset defaults");
        pesoRow.appendChild(resetBtn);
      }
      dCard.appendChild(pesoRow);

      // Dynamic criteria list
      dCard.appendChild(el("div", {style:{fontSize:"12px", fontWeight:"600", color:"var(--muted)", marginBottom:"6px"}}, "Criterios de evaluaci\u00f3n:"));
      const criteriosWrap = el("div");
      const renderCriterios = () => {
        criteriosWrap.innerHTML = "";
        localValues[d].criterios.forEach((c, idx) => {
          const cRow = el("div", {style:{display:"flex", gap:"6px", marginBottom:"6px", alignItems:"center"}});
          const cInput = el("input", {type:"text", placeholder:`Criterio ${idx+1}`});
          cInput.value = c;
          cInput.style.cssText = "flex:1;padding:7px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit;box-sizing:border-box;";
          cInput.addEventListener("input", e => { localValues[d].criterios[idx] = e.target.value; });
          cRow.appendChild(cInput);
          if (localValues[d].criterios.length > 1) {
            const delBtn = el("button", {style:{background:"none",border:"none",cursor:"pointer",color:"var(--red)",fontSize:"18px",padding:"0 4px",flexShrink:"0"}, onClick: () => {
              localValues[d].criterios.splice(idx, 1);
              renderCriterios();
            }}, "\u00d7");
            cRow.appendChild(delBtn);
          }
          criteriosWrap.appendChild(cRow);
        });
        criteriosWrap.appendChild(el("button", {className:"btn btn-secondary btn-sm", style:{width:"100%", marginTop:"4px"}, onClick: () => {
          localValues[d].criterios.push("");
          renderCriterios();
        }}, "+ A\u00f1adir criterio"));
      };
      renderCriterios();
      dCard.appendChild(criteriosWrap);
      formCard.appendChild(dCard);
    });

    // Validate total peso = 100%
    const btnRow = el("div", {style:{display:"flex", gap:"8px", marginTop:"12px"}});
    btnRow.appendChild(el("button", {className:"btn btn-primary btn-sm", onClick: async () => {
      const totalPeso = DRIVER_ORDER.reduce((s,d) => s + localValues[d].peso, 0);
      if (Math.abs(totalPeso - 1) > 0.02) {
        alert(`Los pesos deben sumar 100%. Actualmente suman ${Math.round(totalPeso*100)}%.`);
        return;
      }
      state.loading = true; render();
      try {
        for (const d of DRIVER_ORDER) {
          const baseW = base.weights[d];
          const baseCriterios = base.criteria[d];
          const lv = localValues[d];
          const criteriosChanged = JSON.stringify(lv.criterios) !== JSON.stringify(baseCriterios);
          const hasChange = Math.abs(lv.peso - baseW) > 0.001 || criteriosChanged;
          if (hasChange) {
            await apiRequest("SaveConfig", { method:"POST", body: JSON.stringify({
              EvaluadoID: subject.ID, DriverID: d, Peso: lv.peso,
              Criterio1: lv.criterios[0] || "",
              Criterio2: lv.criterios[1] || "",
              Criterios: JSON.stringify(lv.criterios)
            })});
          }
        }
        await loadConfigDrivers(subject.ID);
        state.editingConfigSubject = null;
        alert("Configuraci\u00f3n guardada correctamente.");
      } catch(e) { alert("Error: " + e.message); }
      state.loading = false; render();
    }}, "Guardar configuraci\u00f3n"));
    btnRow.appendChild(el("button", {className:"btn btn-secondary btn-sm", onClick: () => { state.editingConfigSubject = null; render(); }}, "Cancelar"));
    formCard.appendChild(btnRow);
    cont.appendChild(formCard);
    return cont;
  }

  // List of team members
  cont.appendChild(el("div", {className:"section-label", style:{marginTop:"8px"}}, "Selecciona un evaluado para configurar sus drivers"));
  state.team.forEach(m => {
    const hasCustom = state.configDrivers[m.ID] && Object.keys(state.configDrivers[m.ID]).length > 0;
    const row = el("div", {style:{display:"flex", alignItems:"center", gap:"10px", padding:"12px 16px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:"10px", marginBottom:"6px", cursor:"pointer"}, onClick: async () => {
      state.editingConfigSubject = m;
      state.loading = true; render();
      await loadConfigDrivers(m.ID);
      state.loading = false; render();
    }});
    const info = el("div", {style:{flex:"1"}});
    info.appendChild(el("div", {style:{fontWeight:"700", fontSize:"14px", color:"var(--text)"}}, m.Nombre));
    info.appendChild(el("div", {style:{fontSize:"12px", color:"var(--faint)"}}, `${m.Rol} · Grado ${m.Grado}`));
    row.appendChild(info);
    if (hasCustom) {
      const pill = el("span", {className:"pill"});
      pill.style.background = "var(--yellow-bg)"; pill.style.color = "var(--yellow)";
      pill.textContent = "⚙ Personalizado";
      row.appendChild(pill);
    }
    row.appendChild(el("span", {style:{color:"var(--indra)", fontSize:"14px"}}, "→"));
    cont.appendChild(row);
  });
  return cont;
}

// ═══ ADMIN ROOT — detalle por evaluador (solo admin raíz) ═══

  cont.appendChild(el("div", {className:"page-sub"}, "Vista exclusiva del administrador raíz"));
  const totalEvals = state.evaluators.length;

    const memberResponses = state.responses.filter(r => r.EvaluadoID === member.ID);
    const avg = calcWeightedAvg(memberResponses, member.Rol, member);
    const pct = totalEvals > 0 ? memberResponses.length / totalEvals : 0;
    const card = el("div", {className:"subject-card"});
    card.addEventListener("click", async () => {
      state.reportSubject = member;
      await loadResponses(member.ID);
      state.view = "adminRootReport"; render();
    });
    const cardHeader = el("div", {className:"subject-card-header"});
    const left = el("div");
    left.appendChild(el("div", {style:{fontWeight:"700",fontSize:"15px",color:"var(--text)"}}, member.Nombre));
    left.appendChild(el("div", {style:{fontSize:"12px",color:"var(--faint)",marginTop:"2px"}}, `${member.Rol} · Grado ${member.Grado}`));
    cardHeader.appendChild(left);
    const right = el("div", {style:{textAlign:"right",display:"flex",gap:"10px",alignItems:"center"}});
    const scoreEl = el("div", {className:"subject-score"});
    scoreEl.style.color = avg ? getScoreColor(avg) : "var(--faint)";
    scoreEl.textContent = avg || "–";
    right.appendChild(scoreEl);
    right.appendChild(el("div", {style:{fontSize:"11px",color:"var(--faint)"}}, `${memberResponses.length}/${totalEvals} resp.`));
    cardHeader.appendChild(right);
    card.appendChild(cardHeader);
    const progressWrap = el("div", {style:{display:"flex",alignItems:"center",gap:"8px",marginTop:"10px"}});
    const pb = renderProgressBar(pct, pct === 1 ? "var(--green)" : "var(--indra)");
    pb.style.flex = "1";
    progressWrap.appendChild(pb);
    progressWrap.appendChild(el("span", {style:{fontSize:"11px",color:"var(--faint)",whiteSpace:"nowrap"}}, `${Math.round(pct*100)}%`));
    card.appendChild(progressWrap);
    if (avg) {
      const miniPills = el("div", {className:"driver-mini"});
      DRIVER_ORDER.forEach(d => {
        const da = calcDriverAvg(memberResponses, d);
        if (da) {
          const pill = el("span", {className:"driver-mini-pill"});
          pill.style.background = getScoreBg(da);
          pill.style.color = getScoreColor(da);
          pill.textContent = `${DRIVER_ICONS[d]} ${da}`;
          miniPills.appendChild(pill);
        }
      });
      card.appendChild(miniPills);
    }
    cont.appendChild(card);
  });
  return cont;
}

function renderAdminRootReport() {
  const subject = state.reportSubject;
  const cfg = getDriverConfig(subject);
  const responses = state.responses.filter(r => r.EvaluadoID === subject.ID);
  const avg = calcWeightedAvg(responses, subject.Rol);
  const avgNum = avg ? parseFloat(avg) : 0;
  const cont = el("div", {className:"container"});
  cont.appendChild(el("button", {className:"btn btn-secondary btn-sm", style:{marginBottom:"20px"}, onClick: async () => {
    await loadResponses(); state.view = "adminRoot"; render();
  }}, "← Volver a Admin"));
  cont.appendChild(el("div", {className:"page-title"}, `Admin 360° — ${subject.Nombre}`));
  cont.appendChild(el("div", {className:"page-sub"}, `${subject.Rol} · Grado ${subject.Grado} · ${responses.length} evaluaciones`));
  if (!responses.length) {
    cont.appendChild(el("div", {className:"empty"}, "Sin respuestas aún para este evaluado."));
    return cont;
  }
  const overallCard = el("div", {className:"card", style:{marginBottom:"16px"}});
  overallCard.style.background = avg ? getScoreBg(avg) : "var(--indra-light)";
  overallCard.style.borderColor = avg ? getScoreColor(avg) + "40" : "rgba(0,61,165,0.2)";
  const overallRow = el("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
  const overallLeft = el("div");
  overallLeft.appendChild(el("div", {className:"section-label"}, "Puntuación global ponderada"));
  const overallScore = el("div", {style:{fontSize:"40px",fontWeight:"900"}});
  overallScore.style.color = avg ? getScoreColor(avg) : "var(--indra)";
  overallScore.textContent = avg || "–";
  overallLeft.appendChild(overallScore);
  if (avg) {
    const scoreLbl = el("div", {style:{fontSize:"14px",fontWeight:"600"}});
    scoreLbl.style.color = getScoreColor(avg);
    scoreLbl.textContent = SCORE_META[Math.round(avgNum)]?.label || "";
    overallLeft.appendChild(scoreLbl);
  }
  overallRow.appendChild(overallLeft);
  const driverScores = {};
  DRIVER_ORDER.forEach(d => { driverScores[d] = calcDriverAvg(responses, d); });
  overallRow.appendChild(renderRadar(driverScores, subject.Rol));
  overallCard.appendChild(overallRow);
  cont.appendChild(overallCard);
  const driversCard = el("div", {className:"card", style:{marginBottom:"16px"}});
  driversCard.appendChild(el("div", {className:"section-label"}, "Detalle por driver"));
  DRIVER_ORDER.forEach(d => {
    const da = driverScores[d];
    const daNum = da ? parseFloat(da) : 0;
    const row = el("div", {className:"driver-report-row"});
    row.appendChild(el("span", {className:"driver-report-icon"}, DRIVER_ICONS[d]));
    const nameWrap = el("div", {style:{flex:"1"}});
    nameWrap.appendChild(el("div", {className:"driver-report-name"}, DRIVER_NAMES[d]));
    nameWrap.appendChild(el("div", {className:"driver-report-weight"}, `Peso ${(cfg.weights[d]*100).toFixed(0)}%`));
    row.appendChild(nameWrap);
    const barWrap = el("div", {className:"driver-bar-wrap"});
    barWrap.appendChild(renderProgressBar(daNum/5, da ? getScoreColor(da) : undefined));
    row.appendChild(barWrap);
    const scoreEl = el("div", {className:"driver-score-val"});
    scoreEl.style.color = da ? getScoreColor(da) : "var(--faint)";
    scoreEl.textContent = da || "–";
    row.appendChild(scoreEl);
    driversCard.appendChild(row);
  });
  cont.appendChild(driversCard);
  // Detalle por evaluador
  const adminSection = el("div", {className:"admin-only"});
  adminSection.appendChild(el("div", {className:"admin-only-title"}, "Detalle por evaluador"));
  responses.forEach(r => {
    const evaluator = state.evaluators.find(e => e.ID === r.EvaluadorID);
    const rRow = el("div", {className:"response-row"});
    const evalHeader = el("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}});
    const evalName = el("div", {className:"response-evaluator", style:{margin:"0"}});
    evalName.textContent = evaluator?.Nombre || r.EvaluadorNombre || `Evaluador ${r.EvaluadorID}`;
    const dateEl = el("span", {className:"response-date"});
    dateEl.textContent = r.FechaEnvio ? new Date(r.FechaEnvio).toLocaleString("es-ES") : "";
    evalName.appendChild(dateEl);
    evalHeader.appendChild(evalName);
    const maxScore = Math.max(...DRIVER_ORDER.map(d => {
      const map = {capacidad_analitica:"CapAnalit",excelencia_entrega:"ExcEntrega",trabajo_equipo:"TrabEquipo",gestion:"Gestion",interlocucion:"Interlocucion",conocimiento_tecnico:"ConocTecnico"};
      return r[`Score_${map[d]}`] || 0;
    }));
    if (maxScore >= 4) {
      const delBtn = el("button", {className:"btn btn-danger btn-sm", onClick: async () => {
        if (!confirm(`¿Eliminar la evaluación de ${evaluator?.Nombre || r.EvaluadorNombre}?`)) return;
        state.loading = true; render();
        try {
          await deleteRespuesta(r.Periodo, r.ID);
          await loadResponses(subject.ID);
          state.reportSubject = subject;
          state.view = "adminRootReport";
        } catch(e) { alert("Error: " + e.message); }
        state.loading = false; render();
      }}, "🗑 Eliminar");
      evalHeader.appendChild(delBtn);
    }
    rRow.appendChild(evalHeader);
    DRIVER_ORDER.forEach(d => {
      const map = {capacidad_analitica:"CapAnalit",excelencia_entrega:"ExcEntrega",trabajo_equipo:"TrabEquipo",gestion:"Gestion",interlocucion:"Interlocucion",conocimiento_tecnico:"ConocTecnico"};
      const key = map[d];
      const score = r[`Score_${key}`];
      if (!score) return;
      const dRow = el("div", {className:"response-driver"});
      const scoreSpan = el("span", {style:{fontWeight:"700"}});
      scoreSpan.style.color = getScoreColor(score.toString());
      scoreSpan.textContent = score;
      dRow.appendChild(document.createTextNode(`${DRIVER_NAMES[d]}: `));
      dRow.appendChild(scoreSpan);
      const pick = r[`Pick_${key}`];
      const comment = r[`Comment_${key}`];
      if (pick || comment) {
        dRow.appendChild(document.createTextNode(` — ${pick || ""}${pick && comment ? ". " : ""}${comment || ""}`));
      }
      rRow.appendChild(dRow);
    });
    adminSection.appendChild(rRow);
  });
  cont.appendChild(adminSection);
  return cont;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.loading) {
    const loadingEl = el("div", {className:"loading"}, "⟳ Cargando...");
    app.appendChild(loadingEl);
    return;
  }

  const topbar = renderTopbar();
  if (topbar) app.appendChild(topbar);

  // Admin tabs
  if (state.isAdmin && !["adminReport","adminRootReport","login"].includes(state.view)) {
    const adminViews = ["adminDash","adminConfig","adminCampanas","adminConfigDrivers","adminRoot"];
    if (adminViews.includes(state.view)) {
      const tabs = el("div", {className:"tabs"});
      const tabList = [
        {id:"adminDash", label:"📊 Resultados"},
        {id:"adminCampanas", label:"📅 Campañas"},
        {id:"adminConfigDrivers", label:"⚙️ Drivers"},
        {id:"adminConfig", label:"👥 Equipo y Evaluadores"}
      ];
      // Tab Admin solo visible para el admin raíz
      if (state.isRootAdmin) {
        tabList.push({id:"adminRoot", label:"🔐 Admin"});
      }
      tabList.forEach(tab => {
        const btn = el("button", {className:"tab-btn" + (state.view === tab.id ? " active" : ""), onClick: async () => {
          state.view = tab.id;
          if (tab.id === "adminDash" || tab.id === "adminRoot") await loadResponses();
          if (tab.id === "adminConfig") { await loadTeam(); await loadEvaluators(); }
          if (tab.id === "adminCampanas") await loadCampanas();
          render();
        }}, tab.label);
        tabs.appendChild(btn);
      });
      app.appendChild(tabs);
    }
  }

  let content;
  switch(state.view) {
    case "login": content = renderLogin(); break;
    case "selectSubjects": content = renderSelectSubjects(); break;
    case "evalList": content = renderEvalList(); break;
    case "evalForm": content = renderEvalForm(); break;
    case "done": content = renderDone(); break;
    case "adminDash": content = renderAdminDash(); break;
    case "adminReport": content = renderAdminReport(); break;
    case "adminConfig": content = renderAdminConfig(); break;
    case "adminCampanas": content = renderAdminCampanas(); break;
    case "adminRoot": content = renderAdminRoot(); break;
    case "adminRootReport": content = renderAdminRootReport(); break;
    case "adminConfigDrivers":
      renderAdminConfigDrivers().then(c => { if (c) app.appendChild(c); });
      return;
    default: content = renderLogin();
  }

  if (content) app.appendChild(content);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
